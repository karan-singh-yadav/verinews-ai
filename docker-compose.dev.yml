# Development overlay (hot reload):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  backend:
    command: ["sh", "-c", "exec uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips '*'"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml
      - ./configs:/app/configs

  frontend:
    build:
      context: ./frontend
      target: build
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    healthcheck:
      disable: true
