# Served by nginx inside the frontend container (listens on 8080 so it can run unprivileged).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 256k;   # the API itself rejects bodies above 200 KB

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Fonts and scripts are bundled, so everything is same-origin. 'unsafe-inline' for styles is
    # needed because the scales position their markers with inline style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Re-resolve the backend name at request time so nginx starts even if the API is still booting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # OVERWRITE (never append) so a client cannot spoof its IP to dodge the rate limiter.
        # If another proxy (Caddy, a cloud load balancer) sits in front, see docs/DEPLOYMENT.md.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 70s;   # online verification can take up to ~40 s
        # The backend sets these too; hide its copies so each header is sent exactly once.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Hashed build assets never change; `expires` is used (not add_header) so the
    # security headers above keep applying.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: unknown paths serve index.html so /history etc. work on refresh.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
